services:
  - type: web
    name: controle-de-notas-cfs
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run start:render
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_OPTIONS
        value: "--experimental-sqlite"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # As contas de acesso são criadas automaticamente quando o banco está
      # vazio. "true" faria o sistema resetar as senhas a cada reinício.
      - key: SEED_DEMO_DATA
        value: "false"
      - key: DATABASE_DIR
        value: /var/data
    disk:
      name: cfs2026-data
      mountPath: /var/data
      sizeGB: 1
